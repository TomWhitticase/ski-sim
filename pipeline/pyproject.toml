[project]
name = "mountain-pipeline"
version = "0.1.0"
description = "Builds mountain-map resort assets from real geospatial data"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pillow>=11",
    "pyproj>=3.7",
    "rasterio>=1.4",
]

[project.scripts]
mountain-pipeline = "mountain_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
